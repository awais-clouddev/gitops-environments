apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helpdesk-development
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/awais-clouddev/gitops-environments.git
    targetRevision: main
    path: apps/helpdesk/overlays/development

  destination:
    server: https://kubernetes.default.svc
    namespace: helpdesk-development

  syncPolicy:
    automated:
      enabled: true
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
