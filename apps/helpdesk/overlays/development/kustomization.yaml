apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: helpdesk-development

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/environment: development

patches:
  - target:
      kind: Deployment
      name: helpdesk-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: Deployment
      name: helpdesk-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

images:
  - name: ghcr.io/awais-clouddev/gitops-cicd-deployment-platform-api
    newName: ghcr.io/awais-clouddev/gitops-cicd-deployment-platform-api
    digest: sha256:47e0c71aa16efbfc5307a484f929caf0519b4fc682a2faa8955c68a7deb15d63

  - name: ghcr.io/awais-clouddev/gitops-cicd-deployment-platform-frontend
    newName: ghcr.io/awais-clouddev/gitops-cicd-deployment-platform-frontend
    digest: sha256:275c29fa31da85f242aba222d84e968d3c1f670ac86663ce718de34ad8c47f92
