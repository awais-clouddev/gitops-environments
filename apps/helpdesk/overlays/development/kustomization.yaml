apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: helpdesk-development

resources:
  - ../../base

labels:
  - pairs:
      app.kubernetes.io/environment: development

patches:
  - target:
      kind: Deployment
      name: helpdesk-api
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

  - target:
      kind: Deployment
      name: helpdesk-frontend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1

