apiVersion: v1
kind: ConfigMap
metadata:
  name: helpdesk-gateway-config
data:
  default.conf: |
    server {
        listen 80;

        location / {
            proxy_pass http://helpdesk-frontend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/ {
            proxy_pass http://helpdesk-api:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
