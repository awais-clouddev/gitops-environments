apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: helpdesk-frontend
  template:
    metadata:
      labels:
        app: helpdesk-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/awais-clouddev/gitops-cicd-deployment-platform-frontend:sha-placeholder
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: helpdesk-frontend
spec:
  selector:
    app: helpdesk-frontend
  ports:
    - port: 8080
      targetPort: 8080
