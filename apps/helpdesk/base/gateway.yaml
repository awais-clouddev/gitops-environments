apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helpdesk-gateway
  template:
    metadata:
      labels:
        app: helpdesk-gateway
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: nginx-config
          configMap:
            name: helpdesk-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: helpdesk-gateway
spec:
  selector:
    app: helpdesk-gateway
  ports:
    - port: 80
      targetPort: 80
