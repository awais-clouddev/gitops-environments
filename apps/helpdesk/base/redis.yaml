apiVersion: apps/v1
kind: Deployment
metadata:
  name: helpdesk-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: helpdesk-redis
  template:
    metadata:
      labels:
        app: helpdesk-redis
    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 10
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: helpdesk-redis
spec:
  selector:
    app: helpdesk-redis
  ports:
    - port: 6379
      targetPort: 6379
